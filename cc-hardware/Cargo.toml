[package]
edition      = "2021"
name         = "cancomponents"
version      = "0.3.0"
build        = "build.rs"
# Informational only: cc-hardware builds with the pinned "esp" rustup channel
# (see rust-toolchain.toml), a custom Xtensa fork of nightly, not a stable
# release. `cargo-msrv` cannot verify this value against that toolchain, so
# it's kept in sync with cc-core's MSRV by hand.
rust-version = "1.97"
license      = "GPL-3.0-or-later"

[[bin]]
name = "cancomponents"
path = "./src/bin/main.rs"

[features]
default = ["std"]
std = []

[dependencies]
critical-section    = { version = "1.2" }
esp-hal             = { version = "1.2.2", features = ["esp32", "unstable"] }
esp-println         = { version = "0.18", features = ["esp32"] }
esp-backtrace       = { version = "0.20", features = ["esp32","println","panic-handler"] }
esp-hal-ota         = { version = "0.6", features = ["esp32"] }
esp-storage         = { version = "0.10", features = ["esp32", "embedded-storage"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32"] }
nb                  = { version = "1.1" }
embassy-executor    = { version = "0.10" }
embassy-sync        = { version = "0.8" }
embassy-time        = { version = "0.5" }
embassy-futures     = { version = "0.1" }
embassy-embedded-hal = { version = "0.6" }
esp-rtos            = { version = "0.4", features = ["esp32", "embassy"] }
embedded-can        = { version = "0.4" }
embedded-io-async   = { version = "0.7" }
embedded-storage    = { version = "0.3" }
static_cell         = { version = "2.1", features = ["nightly"] }
heapless            = { version = "0.9" }
async-trait         = { version = "0.1" }
sequential-storage  = { version = "8.0" }
bareminal_cli       = { version = "0.3", default-features = false, features = ["async-no-std"] }
bareminal_macros    = { version = "0.3" }
num_enum            = { version = "0.7", default-features = false }
cancomponents-core  = { path = "../cc-core/" }
thiserror           = { version = "2", default-features = false }

[build-dependencies]
vergen-git2         = { version = "10", features = ["build", "cargo", "rustc", "si"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = false
