name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # cc-core is plain #![no_std]-but-host-testable Rust: fmt, clippy and the
  # test suite all run on a normal stable toolchain.
  cc-core:
    name: cc-core / fmt & clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  cc-core-coverage:
    name: cc-core / nextest & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Run tests under coverage
        run: cargo llvm-cov nextest --no-report
      - name: Generate lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Write coverage summary
        run: |
          {
            echo '### cc-core coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cc-core-coverage
          path: cc-core/lcov.info

  cc-core-msrv:
    name: cc-core / MSRV
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - name: Verify declared rust-version actually builds
        run: cargo msrv verify

  # cc-hardware is the ESP32 firmware; it only ever builds with the custom
  # "esp" toolchain channel pinned in cc-hardware/rust-toolchain.toml, so it
  # can't run `cargo test`/`cargo msrv` (no native target, no rustup release
  # matching that channel). fmt + clippy still apply directly.
  cc-hardware:
    name: cc-hardware / fmt & clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-hardware
    steps:
      - uses: actions/checkout@v5
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32
          version: "1.97.0"
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  # Builds both profiles and archives the flashable firmware as workflow
  # artifacts. Every push/PR/tag gets a downloadable build; pushing a `v*`
  # tag additionally publishes the release build as a GitHub Release, see
  # release.yml.
  cc-hardware-build:
    name: cc-hardware / build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
    defaults:
      run:
        working-directory: cc-hardware
    steps:
      - uses: actions/checkout@v5
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32
          version: "1.97.0"
      - name: Install espflash
        # Needed by build.rs, which shells out to `espflash save-image` to
        # turn the linked ELF into a flashable raw image (cancomponents.bin).
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o /tmp/espflash.zip "https://github.com/esp-rs/espflash/releases/latest/download/espflash-x86_64-unknown-linux-gnu.zip"
          unzip -o /tmp/espflash.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/espflash"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo build ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp "target/xtensa-esp32-none-elf/${{ matrix.profile }}/cancomponents" dist/cancomponents.elf
          cp "target/xtensa-esp32-none-elf/${{ matrix.profile }}/cancomponents.bin" dist/cancomponents.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cancomponents-${{ matrix.profile }}
          path: cc-hardware/dist/

  cc-hardware-sbom:
    name: cc-hardware / SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-sbom
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/cargo-sbom" "https://github.com/psastras/sbom-rs/releases/download/cargo-sbom-latest/cargo-sbom-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/.local/bin/cargo-sbom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate SPDX SBOM
        run: cargo-sbom --output-format=spdx_json_2_3 --project-directory cc-hardware > cancomponents.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: cancomponents-sbom
          path: cancomponents.spdx.json
